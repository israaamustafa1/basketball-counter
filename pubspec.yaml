name: basketball_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/backgroundImage.jpg
    - assets/images/crown.png
    - assets/images/sparks.png

  fonts:
    - family: Font
      fonts:
        - asset: assets/fonts/SuperFunky-lgmWw.ttf
        # - asset: assets/fonts/Fredoka-SemiBold.ttf
        #   weight: 600
        # - asset: assets/fonts/Fredoka-Bold.ttf
        #   weight: 700
    - family: Font2
      fonts:
        - asset: assets/fonts/SuperMaples-2vR2w.ttf
    